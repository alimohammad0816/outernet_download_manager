<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Outernet</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header><img src="icon.png" alt="" width="25" height="25"><h1>Outernet</h1></header>
  <p id="status" role="status" data-state="checking"><span>Checking desktop connection…</span></p>
  <section class="preferences">
    <div class="quality-field">
      <span id="quality-label">Stream quality</span>
      <div id="quality" role="group" aria-labelledby="quality-label">
        <button type="button" data-height="0" aria-pressed="true">Best</button>
        <button type="button" data-height="1080" aria-pressed="false" title="Up to 1080p">1080p</button>
        <button type="button" data-height="720" aria-pressed="false" title="Up to 720p">720p</button>
        <button type="button" data-height="480" aria-pressed="false" title="Up to 480p">480p</button>
        <button type="button" data-height="360" aria-pressed="false" title="Up to 360p">360p</button>
      </div>
    </div>
    <label class="auto-setting" title="Hold Alt while clicking a link to keep it in your browser.">Take over eligible downloads
      <input id="automatic" type="checkbox" role="switch">
    </label>
  </section>
  <ul id="streams" aria-label="Detected video streams"></ul>
  <p id="hint">Right-click a link to send it to Outernet.</p>
</body>
</html>
