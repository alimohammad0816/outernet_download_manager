name: Desktop builds

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      test_large_file:
        description: Run the 4 GiB transfer test
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            bundle: deb
            artifact: linux-x64-deb
            path: src-tauri/target/release/bundle/deb/*.deb
          - runner: windows-2025
            bundle: nsis
            artifact: windows-x64-nsis
            path: src-tauri/target/release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build and engine dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev cmake ffmpeg
      - name: Install Windows test engines
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg nasm --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:ChocolateyInstall\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $binary = Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg" -Recurse -Filter ffmpeg.exe |
            Select-Object -First 1
          if ($binary) {
            $binary.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - run: ffmpeg -version
      - run: npm ci
      - run: npm run build
      - run: npm run check:extension
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Test download integrity
        shell: bash
        run: |
          output="$RUNNER_TEMP/outernet-tests.log"
          if ! cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee "$output"; then
            awk '/^error(:|\[)|panicked at|Some\(|Cannot |assertion failed|left:|right:/ {
              gsub(/%/, "%25"); gsub(/\r/, ""); print "::error title=Outernet tests::" substr($0, 1, 450);
              if (++count >= 18) exit;
            }' "$output"
            exit 1
          fi
      - name: Verify transfer larger than 4 GiB
        if: startsWith(github.ref, 'refs/tags/v') || inputs.test_large_file
        run: cargo test --release --locked --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml --test download_integrity downloads_over_four_gib -- --ignored --exact
      - name: Build installer
        run: npm run tauri -- build --bundles ${{ matrix.bundle }} -- --locked
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Package the browser extension
        working-directory: browser
        run: zip -q -r ../outernet-browser-extension.zip .
      - uses: actions/upload-artifact@v7
        with:
          name: browser-extension
          path: outernet-browser-extension.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, browser]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          test "$GITHUB_REF_NAME" = "v$version"
          gh release create "$GITHUB_REF_NAME" installers/*.deb installers/*-setup.exe installers/outernet-browser-extension.zip --verify-tag --draft --generate-notes
